site_name: qrisp-optimization
site_description: A collection of problems and algorithms for Eclipse Qrisp for combinatorial optimization
site_author: Cedric Schacht

repo_name: CedricSchacht/qrisp_optimization
repo_url: https://github.com/CedricSchacht/qrisp_optimization

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
            - https://numpy.org/doc/stable/objects.inv
          options:
            docstring_style: numpy
            members_order: source
            filters: ["!^_"]
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
  - mkdocs-jupyter:
      # notebooks are rendered with their saved outputs, not re-executed on build
      execute: false
      include_source: true

nav:
  - Home: index.md
  - Guides:
      - Solve an existing problem: guides/solve-existing-problem.ipynb
      - Add a new problem: guides/new-problem.ipynb
      - Add a new algorithm: guides/new-algorithm.ipynb
  - API reference:
      - Overview: api/index.md
      - Algorithms: api/algorithms.md
      - Requirements: api/requirements.md
      - Problems: api/problems.md
      - Metrics: api/metrics.md
      - Utils: api/utils.md
  - Development: development.md
